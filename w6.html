<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>本機 AI 問答測試</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #111827;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            padding: 30px;
        }

        h1 {
            color: #60a5fa;
        }

        p {
            color: #cbd5e1;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            font-size: 16px;

            background-color: #1f2937;
            color: white;

            border: 1px solid #475569;
            border-radius: 10px;

            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background-color: #3b82f6;
            color: white;

            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2563eb;
        }

        #answer {
            margin-top: 25px;
            padding: 20px;

            background-color: #1f2937;
            border-radius: 10px;

            min-height: 80px;
            line-height: 1.8;

            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>本機 AI 問答</h1>

        <p>
            使用 LM Studio + Qwen3.5-4B
        </p>

        <textarea
            id="question"
            placeholder="請輸入你想問 AI 的問題">
        </textarea>

        <button id="askButton">
            問 AI
        </button>

        <div id="answer">
            AI 的回答會顯示在這裡。
        </div>

    </div>


    <script>

        const askButton = document.getElementById("askButton");
        const question = document.getElementById("question");
        const answer = document.getElementById("answer");


        askButton.addEventListener("click", async function () {

            const userQuestion = question.value.trim();

            if (userQuestion === "") {
                answer.textContent = "請先輸入問題。";
                return;
            }

            answer.textContent = "AI 思考中...";

            try {

                const response = await fetch(
                    "http://localhost:1234/v1/chat/completions",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            model: "qwen3.5-4b",

                            messages: [
                                {
                                    role: "system",
                                    content: "請使用繁體中文回答，回答簡單清楚。"
                                },
                                {
                                    role: "user",
                                    content: userQuestion
                                }
                            ],

                            temperature: 0.7
                        })
                    }
                );


                if (!response.ok) {
                    throw new Error(
                        "HTTP 錯誤：" + response.status
                    );
                }


                const data = await response.json();

                answer.textContent =
                    data.choices[0].message.content;

            }

            catch (error) {

                answer.textContent =
                    "無法連接本機 AI。\n\n" +
                    "請確認 LM Studio Server 是否已啟動。\n\n" +
                    "錯誤：" + error.message;

            }

        });

    </script>

</body>

</html>
